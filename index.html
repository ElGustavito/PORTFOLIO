<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio - Gustavo Oliveira</title>
  <link rel="stylesheet" href="./Css/style.css" />
</head>

<!-- ====| Modo Base como "Pessoal" |==== -->
<body id="mainBody" class="mode-pessoal">

  <!-- =======| BARRA DE NAVEGAÇÃO SUPERIOR |=======  -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <div class="brand-info">
          <img src="Icons/logo.png" alt="Logo" class="nav-logo" />
          <p class="brand-name">Gustavo</p>
        </div>

        <div class="switch-pill">
          <button id="btnPessoal" class="pill-btn active"><b>Dev</b></button>
          <button id="btnArte" class="pill-btn"><b>Arte</b></button>
        </div>
      </div>

      <!-- ===================| Icons e Links |=================== -->
      <ul class="nav-links">
        <li><a href="#home"><img src="Icons/home.png" alt="" class="nav-icon" /> <b>Home</b></a></li>
        <li><a href="#sobre"><img src="Icons/sobre-mim.png" alt="" class="nav-icon" /> <b>Sobre mim</b></a></li>
        <li><a href="#projetos"><img src="Icons/projetos.png" alt="" class="nav-icon" /> <b>Projetos</b></a></li>
        <li id="navArteLink" class="hidden"><a href="#arteBox"><img src="Icons/arte.png" alt="" class="nav-icon" /> <b>Artes</b></a></li>
        <li><a href="#contato"><img src="Icons/contato.png" alt="" class="nav-icon" /> <b>Contato</b></a></li>
      </ul>
    </div>
  </nav>

  <!-- ===================| Foto e Nome |=================== -->
  <div class="portfolio-container" id="home">
    <header class="hero-header">
      <div class="profile-block">
        <div class="avatar-container">
          <div class="avatar-frame">
            <img id="currentAvatar" src="Imagens/Fotos/Foto-Pessoal.png" alt="Gustavo Oliveira" />
          </div>
        </div>

        <!-- =========| Info |========= -->
        <div class="profile-info">
          <h1 class="user-name">Gustavo Oliveira</h1>
          <p id="userRole" class="user-role"></p>
          <div id="socialLinksContainer" class="social-links"></div>
        </div>
      </div>
    </header>

    <!-- ===================| Sobre Mim |=================== -->
    <section id="sobre" class="section-block">
      <h2 class="section-title">Quem sou eu?</h2>
      <p id="sobreTexto" class="about-text"></p>
    </section>

    <!-- ===================| Projetos |=================== -->
    <section id="projetos" class="section-block">
      <h2 class="section-title">Projetos</h2>
      <div id="listaProjetos" class="featured-projects-list"></div>
    </section>

    <!-- =================| Artes |================= -->
    <section id="arteBox" class="section-block hidden">
      <h2 class="section-title">Galeria de Artes</h2>
      <div id="listaArte" class="art-grid"></div>
    </section>

    <!-- ===================| Rodape e Contato |=================== -->
    <footer id="contato" class="main-footer">
      <p>© 2026 Gustavo Felipe de Oliveira — Todos os direitos reservados</p>
    </footer>

  </div>

  <script src="./JavaScript/script.js"></script>
</body>
</html>
